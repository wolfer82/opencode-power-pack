name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-skills:
    # governance#396: self-hosted fleet; same-repository code only on pull requests.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "lts/*"
          package-manager-cache: false
      - run: npm ci
      - run: node --test
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.x"
      - name: Validate Agent Skills specification
        run: |
          python -m pip install skills-ref==0.1.1
          for skill in skills/*; do
            agentskills validate "$skill"
          done

  sandbox-runtime:
    name: sandbox-runtime-linux
    # governance#396: Linux containment runs on the fleet. macOS containment is not
    # scheduled until a Mac runner we operate exists. Fork pull requests do not run here.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20.11.1"
          package-manager-cache: false
      - name: Require sandbox tools already installed on the runner
        run: |
          set -euo pipefail
          missing=0
          for tool in bwrap socat rg curl; do
            if ! command -v "$tool" >/dev/null 2>&1; then
              echo "::error::$tool is not installed on this runner"
              missing=1
            fi
          done
          test "$missing" -eq 0
          bwrap --ro-bind /usr /usr --ro-bind /bin /bin --ro-bind /lib /lib --tmpfs /tmp -- true
      - run: npm ci
      - name: Run sandbox contract and real containment tests
        run: npm run test:sandbox
        env:
          OPP_SANDBOX_INTEGRATION: "1"
